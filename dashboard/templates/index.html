<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentTrap Dashboard</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a313c; --text: #d7dde5;
    --muted: #8b95a3; --accent: #4da3ff; --ok: #3fb950; --bad: #f85149;
    --warn: #d29922; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
         margin-left: auto; }
  label { font-size: 12px; color: var(--muted); display: flex; gap: 6px;
          align-items: center; }
  select, input[type=number] { background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
  button { background: var(--accent); color: #04121f; border: 0; border-radius: 6px;
    padding: 7px 14px; font-weight: 600; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px;
         height: calc(100vh - 58px); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           overflow: hidden; display: flex; flex-direction: column; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #console { flex: 1; overflow-y: auto; padding: 10px 14px; font-family: var(--mono);
             font-size: 12.5px; line-height: 1.5; }
  .step { margin-bottom: 10px; border-left: 2px solid var(--line); padding-left: 10px; }
  .cmd { color: var(--accent); }
  .cmd::before { content: "$ "; color: var(--muted); }
  .out { color: var(--text); white-space: pre-wrap; word-break: break-word; opacity: .9; }
  .note { color: var(--warn); font-style: italic; }
  .flagged { border-left-color: var(--warn); }
  .metrics { padding: 12px 14px; display: grid; gap: 10px; }
  .metric { display: flex; justify-content: space-between; font-size: 13px;
            border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
  .metric .k { color: var(--muted); }
  .metric .v { font-family: var(--mono); font-weight: 600; }
  .pill { padding: 1px 8px; border-radius: 999px; font-size: 12px; }
  .pill.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .pill.bad { background: rgba(248,81,73,.15); color: var(--bad); }
  .pill.run { background: rgba(77,163,255,.15); color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>AgentTrap</h1>
  <span class="sub">live agent console and metrics</span>
  <form id="runform">
    <label>backend
      <select name="backend">
        <option value="mock">mock</option>
        <option value="ollama">ollama</option>
        <option value="anthropic">anthropic</option>
        <option value="openai">openai</option>
        <option value="cli">cli</option>
      </select>
    </label>
    <label>target
      <select name="target"><option value="mock">mock</option><option value="docker">docker</option></select>
    </label>
    <label><input type="checkbox" name="cht_on"> CHT on</label>
    <label><input type="checkbox" name="hardened"> hardened</label>
    <label>max steps <input type="number" name="max_steps" value="20" min="1" max="100" style="width:64px"></label>
    <button type="submit" id="runbtn">Run</button>
  </form>
</header>
<main>
  <section class="panel">
    <h2>Agent console</h2>
    <div id="console"></div>
  </section>
  <section class="panel">
    <h2>Metrics</h2>
    <div class="metrics" id="metrics">
      <div class="metric"><span class="k">cell</span><span class="v" id="m-cell">-</span></div>
      <div class="metric"><span class="k">status</span><span class="v" id="m-status"><span class="pill run">idle</span></span></div>
      <div class="metric"><span class="k">outcome</span><span class="v" id="m-outcome">-</span></div>
      <div class="metric"><span class="k">steps</span><span class="v" id="m-steps">0</span></div>
      <div class="metric"><span class="k">tokens</span><span class="v" id="m-tokens">0</span></div>
      <div class="metric"><span class="k">wall clock (s)</span><span class="v" id="m-time">0</span></div>
      <div class="metric"><span class="k">guardrail flags</span><span class="v" id="m-flags">0</span></div>
    </div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const consoleEl = $("console");
  let source = null;

  function resetView() {
    consoleEl.innerHTML = "";
    ["m-outcome"].forEach(id => $(id).textContent = "-");
    ["m-steps", "m-tokens", "m-flags"].forEach(id => $(id).textContent = "0");
    $("m-time").textContent = "0";
    $("m-status").innerHTML = '<span class="pill run">running</span>';
  }

  function addStep(ev) {
    const div = document.createElement("div");
    div.className = "step" + (ev.flagged ? " flagged" : "");
    const cmd = document.createElement("div");
    cmd.className = "cmd";
    cmd.textContent = ev.command || "(no command)";
    div.appendChild(cmd);
    const body = (ev.stdout || "") + (ev.stderr ? "\n" + ev.stderr : "");
    if (body.trim()) {
      const out = document.createElement("div");
      out.className = "out";
      out.textContent = body.length > 1200 ? body.slice(0, 1200) + " ..." : body;
      div.appendChild(out);
    }
    if (ev.note) {
      const note = document.createElement("div");
      note.className = "note";
      note.textContent = ev.note;
      div.appendChild(note);
    }
    consoleEl.appendChild(div);
    consoleEl.scrollTop = consoleEl.scrollHeight;
    $("m-steps").textContent = ev.step;
  }

  function finish(ev) {
    $("m-outcome").textContent = ev.outcome;
    $("m-tokens").textContent = ev.total_tokens;
    $("m-time").textContent = ev.wall_clock_s;
    $("m-flags").textContent = ev.guardrail_flags;
    const ok = ev.success;
    $("m-status").innerHTML = '<span class="pill ' + (ok ? "ok" : "bad") + '">'
      + (ok ? "rooted" : ev.outcome) + "</span>";
    $("runbtn").disabled = false;
  }

  $("runform").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("runbtn").disabled = true;
    const f = e.target;
    const payload = {
      backend: f.backend.value, target: f.target.value,
      cht_on: f.cht_on.checked, hardened: f.hardened.checked,
      max_steps: Number(f.max_steps.value),
    };
    const r = await fetch("/api/run", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload),
    });
    const { run_id, cell } = await r.json();
    $("m-cell").textContent = cell;
    resetView();
    if (source) source.close();
    source = new EventSource("/api/stream/" + run_id);
    source.onmessage = (m) => {
      const ev = JSON.parse(m.data);
      if (ev.type === "step") addStep(ev);
      else if (ev.type === "run_end") { finish(ev); source.close(); }
    };
    source.onerror = () => { $("runbtn").disabled = false; };
  });
</script>
</body>
</html>
