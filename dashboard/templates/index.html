<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentTrap Dashboard</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a313c; --text: #d7dde5;
    --muted: #8b95a3; --accent: #4da3ff; --ok: #3fb950; --bad: #f85149;
    --warn: #d29922; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; height: 100vh;
          display: grid; grid-template-columns: 440px minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) auto; gap: 16px 20px; }
  .left, .right { min-height: 0; }
  .right { display: flex; flex-direction: column; }

  form.controls { display: grid; grid-template-columns: 1fr 1fr;
    gap: 16px 16px; align-items: end;
    padding: 20px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); }
  label { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
  label.check { flex-direction: row; align-items: center; gap: 10px; min-height: 44px; }
  label.check input { width: 20px; height: 20px; margin: 0; cursor: pointer; }
  select, input[type=number], input:not([type]) { width: 100%; min-height: 44px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font-size: 16px; font-family: inherit; }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input::placeholder { color: var(--muted); opacity: .7; }
  button { background: var(--accent); color: #04121f; border: 0; border-radius: 8px;
    padding: 12px 20px; font-weight: 600; cursor: pointer; font-size: 16px; min-height: 44px;
    width: 100%; }
  button:disabled { opacity: .5; cursor: default; }

  .model { font-size: 15px; font-weight: 600; margin: 2px 2px 10px; }
  .model .v { font-family: var(--mono); color: var(--accent); }

  .status { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 40px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--line);
         padding: 4px 0; }
  .row .k { color: var(--muted); }
  .row .v { font-family: var(--mono); font-weight: 600; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 240px; grid-template-rows: minmax(0, 1fr);
         gap: 20px; flex: 1; min-height: 0; }
  @media (max-width: 960px) { .wrap { height: auto; grid-template-columns: 1fr; grid-template-rows: auto;
            } .wrap .console-wrap { height: 360px; } main { grid-template-rows: auto; } }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } .status { grid-template-columns: 1fr; } }

  .console-wrap { border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
                  display: flex; flex-direction: column; height: 100%; min-height: 200px; }
  .console-wrap h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #console { flex: 1; overflow-y: auto; padding: 10px 12px; font-family: var(--mono);
             font-size: 12px; line-height: 1.5; }
  .step { margin-bottom: 8px; border-left: 2px solid var(--line); padding-left: 9px; }
  .step.flagged { border-left-color: var(--warn); }
  .cmd { color: var(--accent); }
  .cmd::before { content: "$ "; color: var(--muted); }
  .out { color: var(--text); white-space: pre-wrap; word-break: break-word; opacity: .85; }
  .note { color: var(--warn); font-style: italic; }

  .metrics .metric { margin-bottom: 14px; }
  .metrics .name { color: var(--muted); font-size: 13px; }
  .metrics .val { font-family: var(--mono); font-size: 20px; font-weight: 700; }
  .metrics .val .frac { font-size: 13px; color: var(--muted); font-weight: 400; }

  .footer { grid-column: 1 / -1; display: grid; gap: 4px; }
  .footer .row .v.outcome { color: var(--text); }
</style>
</head>
<body>
<div class="wrap">

  <div class="left">
  <form class="controls" id="runform">
    <label>Backend
      <select name="backend">
        <option value="mock">Mock</option><option value="ollama">Ollama</option>
        <option value="anthropic">Anthropic</option><option value="openai">OpenAI</option>
        <option value="cli">CLI</option>
      </select>
    </label>
    <label>Target
      <select name="target"><option value="mock">Mock</option><option value="docker">Docker</option></select>
    </label>
    <label class="check"><input type="checkbox" name="cht_on"> CHT</label>
    <label>Mode
      <select name="mode"><option value="plain">Plain</option><option value="hardened">Hardened</option></select>
    </label>
    <label>Runs <input type="number" name="runs" value="20" min="1" max="50"></label>
    <label>Steps <input type="number" name="max_steps" value="40" min="5" max="120"></label>
    <label>Model <input name="model" value="" placeholder="(default)"></label>
    <label>Container <input name="container" value="agenttrap-decoy"></label>
    <label>User <input name="container_user" value="user1"></label>
    <label>Root Check <input name="root_check_cmd" value="id -u"></label>
    <button type="submit" id="runbtn">Run</button>
  </form>
  </div>

  <div class="right">
  <div class="model">Current LLM Model: <span class="v" id="m-model">-</span></div>

  <div class="status">
    <div class="row"><span class="k">CHT Status</span><span class="v" id="m-cht">OFF</span></div>
    <div class="row"><span class="k">Attacker Mode</span><span class="v" id="m-mode">Plain</span></div>
    <div class="row"><span class="k">Current Run</span><span class="v" id="m-run">0/0</span></div>
    <div class="row"><span class="k">Run Status</span><span class="v" id="m-runstatus">Idle</span></div>
    <div class="row"><span class="k">Runtime</span><span class="v" id="m-runtime">0s</span></div>
    <div class="row"><span class="k">Average Runtime</span><span class="v" id="m-avg">0s</span></div>
  </div>

  <main>
    <div class="console-wrap">
      <h2>Live Console</h2>
      <div id="console"></div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="name">Task Success Rate (TSR)</div>
        <div class="val" id="m-tsr">- <span class="frac"></span></div></div>
      <div class="metric"><div class="name">Defense Success Rate (DSR)</div>
        <div class="val" id="m-dsr">- <span class="frac"></span></div></div>
      <div class="metric"><div class="name">Guardrail Bypass Rate (GBR)</div>
        <div class="val" id="m-gbr">- <span class="frac"></span></div></div>
    </div>
  </main>
  </div>

  <div class="footer">
    <div class="row"><span class="k">Current Run Outcome</span><span class="v outcome" id="m-outcome">-</span></div>
    <div class="row"><span class="k">Defense Encountered</span><span class="v" id="m-defense">-</span></div>
  </div>

</div>
<script>
  const $ = (id) => document.getElementById(id);
  const consoleEl = $("console");
  let source = null, runtimeTimer = null, runStart = 0;

  const fmt = (s) => { s = Math.round(s); const m = Math.floor(s / 60);
    return m > 0 ? `${m}m ${s % 60}s` : `${s}s`; };
  const setRate = (id, r) => {
    $(id).innerHTML = `${r.pct.toFixed(1)} % <span class="frac">(${r.num}/${r.den})</span>`;
  };

  function startRuntime() {
    runStart = Date.now();
    clearInterval(runtimeTimer);
    runtimeTimer = setInterval(() => {
      $("m-runtime").textContent = fmt((Date.now() - runStart) / 1000);
    }, 1000);
  }

  function addStep(ev) {
    const div = document.createElement("div");
    div.className = "step" + (ev.flagged ? " flagged" : "");
    const cmd = document.createElement("div");
    cmd.className = "cmd"; cmd.textContent = ev.command || "(no command)";
    div.appendChild(cmd);
    const body = (ev.stdout || "") + (ev.stderr ? "\n" + ev.stderr : "");
    if (body.trim()) {
      const out = document.createElement("div"); out.className = "out";
      out.textContent = body.length > 800 ? body.slice(0, 800) + " ..." : body;
      div.appendChild(out);
    }
    if (ev.note) { const n = document.createElement("div"); n.className = "note";
      n.textContent = ev.note; div.appendChild(n); }
    consoleEl.appendChild(div);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }

  function onEvent(ev) {
    if (ev.type === "run_index") {
      $("m-run").textContent = `${ev.i}/${ev.n}`;
      $("m-model").textContent = ev.model || "(mock)";
      $("m-cht").textContent = ev.cht_on ? "ON" : "OFF";
      $("m-mode").textContent = ev.hardened ? "Hardened" : "Plain";
      $("m-runstatus").textContent = "Running";
      consoleEl.innerHTML = "";
      startRuntime();
    } else if (ev.type === "step") {
      addStep(ev);
    } else if (ev.type === "aggregate") {
      setRate("m-tsr", ev.tsr); setRate("m-dsr", ev.dsr); setRate("m-gbr", ev.gbr);
      $("m-avg").textContent = fmt(ev.avg_runtime_s);
      $("m-outcome").textContent = ev.last_outcome;
      $("m-defense").textContent = ev.traps.length ? ev.traps.join(", ") : "-";
    } else if (ev.type === "batch_end") {
      $("m-runstatus").textContent = "Completed";
      clearInterval(runtimeTimer);
      $("runbtn").disabled = false;
      if (source) source.close();
    }
  }

  $("runform").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("runbtn").disabled = true;
    const f = e.target;
    const payload = {
      backend: f.backend.value, target: f.target.value,
      cht_on: f.cht_on.checked, hardened: f.mode.value === "hardened",
      runs: Number(f.runs.value), max_steps: Number(f.max_steps.value), model: f.model.value,
      container: f.container.value, container_user: f.container_user.value,
      root_check_cmd: f.root_check_cmd.value, root_check_expect: "0",
    };
    const r = await fetch("/api/run", { method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) });
    const { batch_id, model, cht_on, hardened } = await r.json();
    $("m-model").textContent = model; $("m-cht").textContent = cht_on ? "ON" : "OFF";
    $("m-mode").textContent = hardened ? "Hardened" : "Plain";
    if (source) source.close();
    source = new EventSource("/api/stream/" + batch_id);
    source.onmessage = (m) => onEvent(JSON.parse(m.data));
    source.onerror = () => { $("runbtn").disabled = false; };
  });
</script>
</body>
</html>
